<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurgu Atölyesi</title>
<link rel="stylesheet" href="/studio-fonts.css">
<link rel="stylesheet" href="/vendor/lucide/lucide.css">
<style>
:root{--bg:#0B0A09;--s1:#131210;--s2:#1A1916;--s3:#1F1E1A;--sel:#2E2B26;--well:#0F0E0C;--b1:#22201C;--b2:#2A2824;--b3:#3A3732;--rule:#1C1B18;--text:#ECEAE5;--t2:#A19C92;--t3:#6E6A62;--t4:#5F5B53;--accent:#FDD715;--accent-ink:#1A1500;--neg:#FF4B45;--mono:'Geist Mono',ui-monospace,monospace}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
input,textarea,button{font-family:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:5px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.app{height:100vh;min-width:960px;overflow:hidden;background:var(--bg)}
input[type=number]{appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{appearance:none;margin:0}
.mono{font-family:var(--mono)}
.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
.s12{font-size:12px}
.col{display:flex;flex-direction:column}
.h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.3px}
.eyebrow{font-size:12px;font-weight:500;color:var(--t3)}
.btn{height:32px;padding:0 12px;border:1px solid var(--b2);border-radius:6px;background:var(--s2);color:var(--text);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--b3)}
.btn.y{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.icon{width:30px;height:30px;border:none;border-radius:6px;background:transparent;color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.icon:hover{background:var(--s3);color:var(--text)}
.seg{display:flex;background:var(--well);border:1px solid var(--b1);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;height:26px;border:none;border-radius:5px;background:transparent;color:var(--t2);font-size:12px;font-weight:500;white-space:nowrap;padding:0 6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--sel);color:var(--text)}
.field{height:30px;background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:0 9px;color:var(--text);font-size:13px;outline:none;min-width:0;width:100%}
.field:focus{border-color:var(--accent)}
.home{height:100%;display:grid;grid-template-columns:224px minmax(0,1fr)}
.homenav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border:none;border-radius:6px;background:transparent;color:var(--t2);font-size:13px;font-weight:500;text-align:left;width:100%}
.homenav:hover{background:var(--s2);color:var(--text)}
.homenav.on{background:var(--s3);color:var(--text)}
.active-card{display:flex;flex-wrap:wrap;padding:0;border:1px solid var(--b1);border-radius:10px;background:var(--s1);overflow:hidden;text-align:left;color:var(--text);width:100%}
.active-card:hover{border-color:var(--b3)}
.frame{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.frame video,.frame img.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--b1);border-radius:10px;overflow:hidden}
.swatches>div{border-right:1px solid var(--b1);border-bottom:1px solid var(--b1)}
.dokum-row{width:100%;display:flex;flex-direction:column;gap:5px;padding:10px;border:none;border-radius:6px;background:transparent;text-align:left;color:var(--t2)}
.dokum-row:hover{background:var(--s2)}
.dokum-row.on{background:var(--s3);color:var(--text)}
.unc{text-decoration:underline wavy var(--neg);text-decoration-thickness:1px;text-underline-offset:3px}
.tl-row{display:grid;grid-template-columns:96px minmax(0,1fr);flex:none;border-bottom:1px solid var(--rule)}
.tl-label{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--b1);color:var(--t2);font-size:12px}
.tl-label i{font-size:13px;color:var(--t3)}
.page{height:100%;overflow:auto}
.rule-row{border-bottom:1px solid var(--rule)}
.chip{height:24px;padding:0 9px;border:1px solid var(--b2);border-radius:999px;background:transparent;color:var(--t2);font-size:12px}
.chip:hover:not(:disabled){color:var(--text);border-color:var(--b3)}
.composer{background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:8px 8px 8px 11px;display:flex;flex-direction:column;gap:6px}
.composer:focus-within{border-color:var(--b3)}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:1px dashed var(--b2);border-radius:8px;color:var(--t3);background:transparent;width:100%}
.drop:hover,.drop.over{border-color:var(--b3);color:var(--t2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:640px;z-index:20;background:var(--s3);border:1px solid var(--neg);border-radius:8px;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:10px;line-height:1.45}
.spin{display:inline-block;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
</body>
</html>
